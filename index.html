        h1 {

        }

        }

        .toc h2 {

            margin-top: 0;
        }

        .toc ul {
            padding-left: 25px;

        .toc li {
            margin: 8px 0;
        }

        .toc a {
            font-size: 24px;
            text-decoration: none;
            color: #333;
        }

        .toc a:hover {
            text-decoration: underline;
        }

        .section {
            margin-bottom: 80px;
        }

        .section-title {
            font-size: 40px;
            margin-bottom: 35px;
            padding-bottom: 10px;
            border-bottom: 4px solid #333;
